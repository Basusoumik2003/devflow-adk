[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-adk"
version = "0.1.0"
description = "A decoupled multi-agent framework to explain, write, and deploy code to GitHub"
readme = "README.md"
authors = [
    { name = "Soumik Basu", email = "soumikbasu2003@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.1",
    "PyGithub>=2.1.1",
    "python-dotenv>=1.0.1",
    "streamlit>=1.32.0",
    "rich>=13.7.0"
]

[project.urls]
"Homepage" = "https://github.com"
"Bug Tracker" = "https://github.com/issues"

[project.scripts]
devflow-launch = "app.cli:main"
